<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock, Paper, Scissors!</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="gameContainer">
        <div class="gameHeading">
        <h1>Rock, Paper, Scissors!</h1>
        <h3>Round <span id="roundNum">1</span></h3>
        </div>
        <div class="gameCardContainer">
            <div class="gameCard">
                <p>Score: <span id="humanScore">0</span></p>
                <img src="./images/rock.png" alt="An image of fist" class="gameImg human">
                <p>You</p>
            </div>
            <h3>vs</h3>
            <div class="gameCard">
                <p>Score: <span id="humanScore">0</span></p>
                <img src="./images/rock.png" alt="An image of fist" class="gameImg computer">
                <p>Computer</p>
            </div>
        </div>
        <div class="gameButtonContainer">
            <p>Click an option:</p>
            <button id="rockButton">Rock</button>
            <button id="paperButton">Paper</button>
            <button id="scissorButton">Scissors</button>
        </div>
        </div>
    </div>
</body>
</html>
